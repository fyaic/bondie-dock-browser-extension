<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bondie Dock 配置</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="page-body">
    <main class="options">
      <header class="options-hero">
        <div>
          <h1>Bondie Dock</h1>
          <p>配置 Agent 连接、页面解析能力和本地工作流记忆。</p>
        </div>
        <button id="save" class="primary" type="button">保存设置</button>
      </header>

      <section class="settings-grid">
        <section class="settings-panel">
          <h2>Agent 连接</h2>
          <label>
            Gateway URL
            <input id="gatewayUrl" placeholder="wss://openclaw.example.ts.net">
          </label>
          <label>
            Token
            <input id="token" type="password" autocomplete="off">
          </label>
          <div class="form-grid">
            <label>
              Token mode
              <select id="authMode">
                <option value="gateway-token">GatewayToken / manual approve</option>
                <option value="bootstrap-token">BootstrapToken / auto pairing</option>
              </select>
            </label>
            <label>
              Protocol
              <select id="protocol">
                <option value="node-compatible">OpenClaw Node compatible</option>
                <option value="browser-host">Browser Host Protocol fallback</option>
              </select>
            </label>
          </div>
          <label>
            Node name
            <input id="nodeName" placeholder="Bondie Dock">
          </label>
          <label class="switch-row">
            <input id="autoConnect" type="checkbox">
            <span>
              <strong>自动连接</strong>
              <small>浏览器启动后自动连接 OpenClaw Gateway。</small>
            </span>
          </label>
        </section>

        <section class="settings-panel">
          <h2>Bondie Dock Side Panel</h2>
          <label class="switch-row">
            <input id="sidePanelEnabled" type="checkbox">
            <span>
              <strong>启用侧栏模块</strong>
              <small>保留 popup 默认入口，侧栏通过显式按钮或浏览器侧栏打开。</small>
            </span>
          </label>
          <div class="form-grid">
            <label>
              Adapter
              <select id="sidePanelAdapter">
                <option value="session-bridge">Session Bridge</option>
              </select>
            </label>
            <label>
              超时毫秒数
              <input id="sessionBridgeTimeoutMs" type="number" min="1000" max="120000" step="1000">
            </label>
          </div>
          <label>
            Bondie preview
            <select id="sidePanelBondieFixtureMode">
              <option value="off">关闭</option>
              <option value="fixtures">多实例权限 fixtures</option>
            </select>
          </label>
          <label>
            Identity mode
            <select id="sidePanelIdentityMode">
              <option value="legacy-paired">Legacy paired device</option>
              <option value="oauth">OAuth user identity</option>
            </select>
          </label>
          <label>
            Instance provider
            <select id="sidePanelInstanceProvider">
              <option value="legacy-session-bridge">Legacy Session Bridge</option>
              <option value="bondie-control-plane">Bondie Control Plane</option>
            </select>
          </label>
          <label>
            Local Bondie relationship
            <select id="sidePanelLocalRelationshipType">
              <option value="communication">服务关系：仅相关 sessions</option>
              <option value="subordinate">从属关系：查看全部 sessions</option>
            </select>
          </label>
          <label>
            Control Plane URL
            <input id="sidePanelControlPlaneBaseUrl" placeholder="https://bondie.example.com">
          </label>
          <label>
            Control Plane dev token
            <input id="sidePanelControlPlaneDevToken" type="password" autocomplete="off" placeholder="仅本地 smoke 使用">
          </label>
          <label>
            Session Bridge URL
            <input id="sessionBridgeBaseUrl" placeholder="http://127.0.0.1:8787">
          </label>
          <label>
            Session Bridge token
            <input id="sessionBridgeToken" type="password" autocomplete="off" placeholder="本地 Bridge 访问 token">
          </label>
          <div class="form-grid">
            <label>
              Account
              <input id="sidePanelWorkspaceId" placeholder="default">
            </label>
            <label>
              Organization
              <input id="sidePanelOrganization" placeholder="default">
            </label>
          </div>
          <div class="form-grid">
            <label>
              Route type
              <select id="sidePanelRouteType">
                <option value="browser">Browser</option>
                <option value="direct">Direct chat</option>
                <option value="group">Group chat</option>
              </select>
            </label>
            <label>
              Route key
              <input id="sidePanelRouteKey" placeholder="browser:default">
            </label>
          </div>
          <div class="form-grid">
            <label>
              Route label
              <input id="sidePanelRouteLabel" placeholder="Browser">
            </label>
            <label>
              Operator ID
              <input id="sidePanelOperatorId" placeholder="paired-browser-host">
            </label>
          </div>
        </section>

        <section class="settings-panel">
          <h2>页面智能</h2>
          <label class="switch-row">
            <input id="contextCaptureEnabled" type="checkbox">
            <span>
              <strong>启用页面解析入口</strong>
              <small>用户主动点击时才读取当前页面内容。</small>
            </span>
          </label>
          <label>
            OpenClaw 本地通道
            <input id="captureSessionKey" placeholder="OpenClaw 本地通道">
          </label>
          <label>
            任务超时分钟数
            <input id="handoffTimeoutMinutes" type="number" min="1" max="120" step="1">
          </label>
          <label class="switch-row">
            <input id="suggestionsEnabled" type="checkbox">
            <span>
              <strong>显示恢复建议</strong>
              <small>展示 OpenClaw 或本地 Pattern 生成的页面建议。</small>
            </span>
          </label>
        </section>

        <section class="settings-panel">
          <h2>Pattern Memory</h2>
          <label class="switch-row">
            <input id="patternMemoryEnabled" type="checkbox">
            <span>
              <strong>启用本地工作流记忆</strong>
              <small>只记录 URL、标题、窗口和时间等元数据。</small>
            </span>
          </label>
          <label class="switch-row">
            <input id="patternUploadEnabled" type="checkbox">
            <span>
              <strong>允许上传摘要事件</strong>
              <small>上传的是 Pattern 摘要，不上传完整浏览历史。</small>
            </span>
          </label>
          <div class="form-grid three">
            <label>
              固定组合
              <input id="patternRetentionLimit" type="number" min="10" max="300" step="1">
            </label>
            <label>
              快照
              <input id="patternSnapshotRetentionLimit" type="number" min="10" max="500" step="1">
            </label>
            <label>
              共现阈值
              <input id="patternCandidateMinCooccurrence" type="number" min="2" max="10" step="1">
            </label>
          </div>
          <button id="clearPatterns" class="danger-button" type="button">清空本地 Pattern 数据</button>
        </section>

        <section class="settings-panel">
          <h2>内置解析能力</h2>
          <label class="switch-row">
            <input id="mediaToNotesEnabled" type="checkbox">
            <span>
              <strong>启用 Media to Notes</strong>
              <small>视频、文章、GitHub 仓库优先走该本地能力模块。</small>
            </span>
          </label>
          <label>
            模块目录
            <input id="mediaToNotesPluginPath" placeholder="/path/to/extension/plugins/media-to-notes">
          </label>
          <label>
            笔记输出目录
            <input id="mediaToNotesOutputDir" placeholder="~/.openclaw/workspace/browser-notes">
          </label>
          <div class="form-grid">
            <label>
              环境变量文件
              <input id="mediaToNotesEnvFile" placeholder="留空则读取模块目录下 .env">
            </label>
            <label>
              默认管线参数
              <input id="mediaToNotesDefaultFlags" placeholder="--skip-polish">
            </label>
          </div>
        </section>
      </section>
      <p id="message"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
